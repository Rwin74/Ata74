name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Windows script syntax
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Check version matches release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must match' }
      - name: Build, sign and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATA74_SIGNING_PRIVATE_KEY: ${{ secrets.ATA74_SIGNING_PRIVATE_KEY }}
